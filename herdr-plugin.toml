id = "devicki.respawn"
name = "respawn"
version = "0.3.1"
min_herdr_version = "0.9.1"
platforms = ["linux", "macos"]
description = "Relaunch lazygit, editors and other allowlisted TUIs in their panes after a Herdr server restart or reboot."

# Herdr restores layout, cwd and agent sessions itself; this relaunches everything else on the allowlist.
[[startup]]
command = ["bash", "respawn.sh", "restore"]

[[actions]]
id = "save"
title = "respawn: save now"
command = ["bash", "respawn.sh", "save"]

# Snapshot whenever focus moves or an agent changes state, so a pane's command is on disk
# before the server goes down.
[[events]]
on = "pane.focused"
command = ["bash", "respawn.sh", "save"]

[[events]]
on = "tab.focused"
command = ["bash", "respawn.sh", "save"]

[[events]]
on = "workspace.focused"
command = ["bash", "respawn.sh", "save"]

[[events]]
on = "pane.closed"
command = ["bash", "respawn.sh", "save"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "respawn.sh", "save"]
